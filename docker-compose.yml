name: bizpilot-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bizpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bizpilot}
      POSTGRES_USER: ${DB_USERNAME:-bizpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bizpilot} -d ${DB_NAME:-bizpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bizpilot-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bizpilot-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizpilot-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bizpilot}
      DB_USERNAME: ${DB_USERNAME:-bizpilot}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      # Phase 13: local filesystem document storage only (CLAUDE.md §16) —
      # no MinIO/S3 service is added; /app/uploads is backed by the named
      # volume below so uploaded files survive a container restart.
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/app/uploads}
      # Phase 14: Spring AI foundation (CLAUDE.md §5) — OpenAI only, disabled
      # by default. No new service is added here (no Ollama/proxy/vector DB);
      # OPENAI_API_KEY has no default and is only ever read from .env, never
      # committed. AI_CHAT_PROVIDER/AI_EMBEDDING_PROVIDER default to "none"
      # (Spring AI's own auto-configuration OFF), not "openai" — live Docker
      # validation caught OpenAiChatAutoConfiguration/OpenAiEmbeddingAutoConfiguration
      # each eagerly requiring a non-blank API key at bean-creation time, which
      # broke startup with no key configured. To actually enable AI, set
      # AI_ENABLED=true, AI_PROVIDER=openai, AI_CHAT_PROVIDER=openai,
      # AI_EMBEDDING_PROVIDER=openai, and a real OPENAI_API_KEY together in
      # .env — see docs/security.md §3l.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_CHAT_TEMPERATURE: ${AI_CHAT_TEMPERATURE:-0.7}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - document_storage:/app/uploads
    # No dependency on redis/kafka yet — the Phase 3 backend foundation
    # doesn't talk to either. Those gain `depends_on` once wired in.

  # ---------------------------------------------------------------------
  # Placeholder — enabled once the frontend foundation (Phase 20) exists.
  # Uncomment once frontend/Dockerfile is added.
  # ---------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: bizpilot-frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   ports:
  #     - "5173:80"

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  document_storage:
