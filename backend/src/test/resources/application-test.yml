spring:
  application:
    name: bizpilot-backend-test
  flyway:
    # Adds test-only fixture tables (e.g. for BaseEntity persistence tests) on
    # top of the real production migrations. Never applied outside the test
    # profile, so production schema is unaffected.
    locations: classpath:db/migration,classpath:db/testmigration
  ai:
    model:
      # Defensive, belt-and-suspenders test-only override: even though
      # bizpilot.ai.enabled=false already means no BizPilot AI service bean
      # is ever created (so nothing calls Spring AI at all), this additionally
      # tells Spring AI itself not to auto-configure ANY OpenAI ChatModel/
      # EmbeddingModel bean during the test run — "none" is Spring AI's own
      # documented way to fully disable a model type. Guarantees the entire
      # 491+ -test suite never requires OPENAI_API_KEY under any circumstance,
      # regardless of Spring AI auto-configuration internals this project
      # doesn't control.
      chat: none
      embedding: none
    vectorstore:
      # Same defensive override as chat/embedding above, extended to Phase
      # 15's PGVector starter — guarantees the general test suite never
      # requires a live vector-store bean regardless of any AI_VECTORSTORE_TYPE
      # pollution in the environment the test runs in.
      type: none

bizpilot:
  jwt:
    # Fixed, non-production secret used only by the test suite (never reused
    # for local/staging/production, which always require JWT_SECRET from the
    # environment with no default — see application.yml).
    secret: test-only-jwt-secret-do-not-use-outside-automated-tests-1234567890
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  ai:
    # Explicit even though it's already the global default (application.yml)
    # — self-documents that the test suite deliberately never enables the AI
    # subsystem. DefaultAiChatService/DefaultAiEmbeddingServiceTest construct
    # their subject under test directly with a mocked ChatClient/EmbeddingModel,
    # never relying on this Spring context at all.
    enabled: false
  documents:
    storage:
      # OS temp directory — self-cleaning-ish, never pollutes the repo, and
      # avoids any collision with a developer's own local `uploads/` (see
      # application.yml). Shared across the whole test run (the single
      # cached Spring context every @SpringBootTest test class reuses), which
      # is fine since every storage key is already namespaced by a random UUID.
      path: ${java.io.tmpdir}/bizpilot-test-documents

logging:
  level:
    root: WARN
    com.bizpilot: INFO
