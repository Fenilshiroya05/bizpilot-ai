spring:
  application:
    name: bizpilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bizpilot}
    username: ${DB_USERNAME:bizpilot}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for schema changes; Hibernate only
      # verifies the mapped entities match what Flyway has already created.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # Primary, framework-level enforcement of the 20 MB document upload
      # limit (CLAUDE.md §16) — requests exceeding this are rejected by
      # Spring before a controller method is ever invoked. Kept as the
      # single source of truth for the limit; DocumentValidator.MAX_FILE_SIZE_BYTES
      # mirrors the same 20 MB value for the application-level check that
      # still applies when DocumentService is exercised directly (e.g. unit
      # tests bypass the servlet-level multipart resolver entirely).
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

bizpilot:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  documents:
    storage:
      # Local filesystem only in Phase 13 (CLAUDE.md §16) — resolved to an
      # absolute path by LocalDocumentStorageService. "uploads" (relative to
      # the working directory) matches the pre-existing backend/uploads/
      # .gitignore entry from Phase 1. Overridden for Docker (an absolute
      # container path backed by a named volume) and for tests (an OS temp
      # directory) — see docker-compose.yml and application-test.yml.
      path: ${DOCUMENT_STORAGE_PATH:uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.bizpilot: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
