spring:
  application:
    name: bizpilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bizpilot}
    username: ${DB_USERNAME:bizpilot}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for schema changes; Hibernate only
      # verifies the mapped entities match what Flyway has already created.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Production-readiness audit finding (post-Phase-19): paired with
  # `server.shutdown: graceful` below — bounds how long Spring waits for
  # in-flight requests (and any other graceful-shutdown-aware bean) to
  # finish during shutdown before proceeding anyway, so a stuck request
  # can never block the container from ever terminating.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # Primary, framework-level enforcement of the 20 MB document upload
      # limit (CLAUDE.md §16) — requests exceeding this are rejected by
      # Spring before a controller method is ever invoked. Kept as the
      # single source of truth for the limit; DocumentValidator.MAX_FILE_SIZE_BYTES
      # mirrors the same 20 MB value for the application-level check that
      # still applies when DocumentService is exercised directly (e.g. unit
      # tests bypass the servlet-level multipart resolver entirely).
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    # Spring AI's own provider-selection properties (CLAUDE.md §5) — kept
    # separate from bizpilot.ai.* below on purpose: this is Spring AI's
    # native configuration surface (which chat/embedding provider, which
    # model, temperature, ...), not a BizPilot-level setting.
    #
    # Default to "none" (Spring AI's own value meaning "do not auto-configure
    # this capability at all"), NOT "openai" — verified via live Docker
    # validation that OpenAiChatAutoConfiguration/OpenAiEmbeddingAutoConfiguration
    # each build their own OpenAiApi bean, and that bean EAGERLY validates a
    # non-blank API key at bean-creation time (BeanCreationException on
    # startup), not lazily at first call. Since Spring AI's own beans are
    # gated by these spring.ai.model.* properties (not by bizpilot.ai.enabled,
    # which only gates BizPilot's OWN DefaultAiChatService/DefaultAiEmbeddingService
    # wrapper beans), defaulting to "openai" here would break application
    # startup in any environment without a real OPENAI_API_KEY — exactly the
    # scenario this phase must support. An operator enabling AI must set
    # AI_CHAT_PROVIDER=openai / AI_EMBEDDING_PROVIDER=openai (alongside
    # AI_ENABLED=true and a real OPENAI_API_KEY) together; see security.md §3l.
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
      # The spring-ai-starter-model-openai starter auto-configures several
      # OTHER OpenAI capabilities BizPilot doesn't use in this (or any
      # planned) phase — text-to-speech, transcription, image generation,
      # moderation. Disabled unconditionally (never provider-selectable via
      # env var) since CLAUDE.md §5 never asks for any of them; re-enable
      # individually only if a future phase genuinely needs one.
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${AI_CHAT_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    # Local-chat-only Ollama support (locked-scope implementation) — a
    # second, independently-selectable chat provider, activated only when
    # AI_CHAT_PROVIDER=ollama (spring.ai.model.chat above). Deliberately no
    # spring.ai.ollama.embedding.* block here: local embeddings/RAG are
    # explicitly out of scope for this change (AI_EMBEDDING_PROVIDER and
    # AI_VECTORSTORE_TYPE stay at their existing "none" default, exactly as
    # they already do for OpenAI-disabled environments today), so only the
    # chat model is configured. base-url matches Ollama's own documented
    # default (http://localhost:11434) but is still set explicitly, per this
    # file's existing "never rely on an implicit default for anything
    # provider-related" discipline.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.5:latest}
    vectorstore:
      # Phase 15: same "default to disabled, not the real backend" discipline
      # as spring.ai.model.* above, for the identical reason. Verified
      # directly against PgVectorStoreAutoConfiguration's own source: its
      # @ConditionalOnProperty(name = "spring.ai.vectorstore.type",
      # havingValue = "pgvector", matchIfMissing = true) means an UNSET value
      # would activate it by default — and its "vectorStore" @Bean method
      # takes EmbeddingModel as a plain, required (non-Optional) constructor
      # argument, which does not exist while spring.ai.model.embedding=none
      # (AI disabled). Left at its implicit default, adding this dependency
      # would have broken application startup with AI disabled — the exact
      # same class of bug as the audio-speech one documented above and in
      # security.md §3l/§3m. AI_VECTORSTORE_TYPE=pgvector must be set
      # together with AI_ENABLED=true / AI_EMBEDDING_PROVIDER=openai / a
      # real OPENAI_API_KEY for the RAG pipeline to actually activate.
      type: ${AI_VECTORSTORE_TYPE:none}
      pgvector:
        # Flyway (V12__create_document_chunks_and_vector_store.sql) owns
        # this table, not Spring AI's own schema initializer — matches this
        # project's "Flyway is the single source of truth for schema
        # changes" rule, applied identically to every other table.
        initialize-schema: false
        schema-validation: false
        remove-existing-vector-store-table: false
        id-type: UUID
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: ${SERVER_PORT:8080}
  # Production-readiness audit finding (post-Phase-19): Spring Boot's default
  # is "immediate" shutdown — on SIGTERM (a plain `docker compose down`/
  # `restart` today; a Kubernetes rolling deployment in a future phase),
  # Tomcat would otherwise terminate in-flight HTTP requests mid-response
  # instead of draining them. `graceful`, paired with `spring.lifecycle.
  # timeout-per-shutdown-phase` above, lets Tomcat stop accepting new
  # requests immediately while letting already-in-flight ones complete
  # (bounded by that timeout) before the JVM exits. Mirrors the document-
  # processing executor's own, already-correct `waitForTasksToCompleteOnShutdown`
  # behavior (DocumentProcessingConfig), just for the HTTP layer.
  shutdown: graceful

bizpilot:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  # Phase 22.5 finding: no CORS configuration existed at all before this —
  # see SecurityConfig's Javadoc. Comma-separated allow-list, never a
  # wildcard; defaults to the frontend's own documented default dev port.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    # Phase 14 — Spring AI foundation (CLAUDE.md §5). Disabled by default:
    # unlike JWT_SECRET (mandatory everywhere, since auth is core to every
    # already-shipped phase), no real feature depends on AI yet, so every
    # environment without an explicit AI_ENABLED=true keeps the AI subsystem
    # entirely inert — DefaultAiChatService/DefaultAiEmbeddingService are
    # simply not created (@ConditionalOnProperty), and no OpenAI API key is
    # ever required to start the application or run the test suite.
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
  documents:
    storage:
      # Local filesystem only in Phase 13 (CLAUDE.md §16) — resolved to an
      # absolute path by LocalDocumentStorageService. "uploads" (relative to
      # the working directory) matches the pre-existing backend/uploads/
      # .gitignore entry from Phase 1. Overridden for Docker (an absolute
      # container path backed by a named volume) and for tests (an OS temp
      # directory) — see docker-compose.yml and application-test.yml.
      path: ${DOCUMENT_STORAGE_PATH:uploads}
    processing:
      # Phase 15 — bounded async executor + recovery-sweep tuning (project
      # instructions §14/§40). Harmless defaults regardless of whether AI is
      # enabled: the executor/scheduler beans always exist (see
      # DocumentProcessingConfig), but nothing submits work to them unless
      # bizpilot.ai.enabled=true.
      executor-core-pool-size: ${DOCUMENT_PROCESSING_EXECUTOR_CORE_POOL_SIZE:2}
      executor-max-pool-size: ${DOCUMENT_PROCESSING_EXECUTOR_MAX_POOL_SIZE:4}
      executor-queue-capacity: ${DOCUMENT_PROCESSING_EXECUTOR_QUEUE_CAPACITY:50}
      # How often the recovery sweep runs, and how long a document must have
      # sat in UPLOADED/PROCESSING before the sweep treats it as stale (the
      # mitigation for the non-durable AFTER_COMMIT + in-JVM async trigger —
      # see docs/security.md §3m). ISO-8601 duration format.
      recovery-interval: ${DOCUMENT_PROCESSING_RECOVERY_INTERVAL:PT2M}
      stale-uploaded-threshold: ${DOCUMENT_PROCESSING_STALE_UPLOADED_THRESHOLD:PT10M}
      stale-processing-threshold: ${DOCUMENT_PROCESSING_STALE_PROCESSING_THRESHOLD:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.bizpilot: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
